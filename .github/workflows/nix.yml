name: Nix package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Evaluate public flake outputs
        run: nix flake check --no-build
      - name: Test Go code
        run: nix develop -c go test ./...
      - name: Vet Go code
        run: nix develop -c go vet ./...
      - name: Test managed installer ownership and rollback
        run: nix develop -c python3 scripts/test-flake-installer.py
      - name: Build and inspect desktop package
        run: nix build .#checks.x86_64-linux.package-layout
